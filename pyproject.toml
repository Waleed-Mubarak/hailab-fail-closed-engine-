[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hailab-fail-closed-engine"
version = "0.1.0"
description = "Deterministic zeroization & autonomous fail-closed security engine."
readme = "README.md"
authors = [
    { name = "Waleed Mubarak", email = "waleedmubarak@substack.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = ["security", "fail-closed", "zeroization", "middleware", "cryptography", "hailab"]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/Waleed-Mubarak/hailab-fail-closed-engine-"
Documentation = "https://github.com/Waleed-Mubarak/hailab-fail-closed-engine-#readme"
Repository = "https://github.com/Waleed-Mubarak/hailab-fail-closed-engine-"
Issues = "https://github.com/Waleed-Mubarak/hailab-fail-closed-engine-/issues"

[tool.setuptools.packages.find]
where = ["src"]


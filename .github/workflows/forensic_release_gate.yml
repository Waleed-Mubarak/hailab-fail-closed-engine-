name: Forensic Release Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  forensic-fail-closed-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Compile check Python files
        run: |
          python -m py_compile tools/verify_bundle_adversarial.py tools/test_verify_bundle_adversarial.py

      - name: Run adversarial verification tests
        run: |
          PYTHONPATH=. python -m unittest discover -s tools -p "test_verify_bundle_adversarial.py" -v

      - name: Verify latest bundle & ledger if present
        run: |
          python - << 'EOF'
          import glob
          import subprocess
          import sys
          from pathlib import Path

          bundles = sorted(glob.glob("reports/bundles/*.tar.gz"), reverse=True)
          pub_key = Path("keys/forensic_ed25519.pub")
          ledger = Path("reports/verification_ledger.jsonl")

          if not bundles or not pub_key.exists():
              print("No bundle or public key found; adversarial tests passed.")
              sys.exit(0)

          verifier_script = Path("tools/verify_bundle_adversarial.py")
          if not verifier_script.exists():
              print(f"Verifier script not found: {verifier_script}")
              sys.exit(1)

          cmd = [sys.executable, str(verifier_script), bundles[0], "--trusted-pub-key", str(pub_key)]
          if ledger.exists():
              cmd.extend(["--ledger", str(ledger)])

          res = subprocess.run(cmd, check=False)
          sys.exit(res.returncode)
          EOF


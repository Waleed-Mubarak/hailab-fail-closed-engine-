name: CI Pipeline - Fail-Closed Engine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies & Package
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .

    - name: Run Engine Unit Tests
      run: |
        pytest test_engine.py

    - name: Build Docker Simulation Image
      run: |
        docker build -t hailab-fail-closed-engine:latest .

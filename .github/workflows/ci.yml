name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Absolute Root and File Path Purge
      run: |
        python -c '
        import os, shutil, subprocess
        bad_chars = ["\u2060", "\u200b", "\ufeff"]
        
        for root, dirs, files in os.walk(".", topdown=False):
            for name in files + dirs:
                if any(bc in name for bc in bad_chars):
                    old_p = os.path.join(root, name)
                    clean_name = name
                    for bc in bad_chars:
                        clean_name = clean_name.replace(bc, "")
                    
                    if not clean_name.strip():
                        print(f"Force removing artifact with bad chars: {old_p}")
                        try:
                            if os.path.isdir(old_p):
                                shutil.rmtree(old_p, ignore_errors=True)
                            else:
                                os.remove(old_p)
                        except Exception as e:
                            print(f"Error removing {old_p}: {e}")
                    else:
                        new_p = os.path.join(root, clean_name)
                        try:
                            subprocess.run(["git", "mv", old_p, new_p], check=False)
                        except Exception:
                            try:
                                os.rename(old_p, new_p)
                            except:
                                pass
        ' || true

    - name: Deep Content Text Sanitization
      run: |
        python -c '
        import glob
        extensions = ("*.py", "*.md", "*.txt", "*.json", "*.yml", "*.yaml")
        files = []
        for ext in extensions:
            files.extend(glob.glob("**/" + ext, recursive=True))
            
        for filepath in files:
            try:
                with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                    content = f.read()
                
                cleaned = content.replace("\u2060", "").replace("\ufeff", "").replace("\u200b", "")
                
                if content != cleaned:
                    with open(filepath, "w", encoding="utf-8") as f:
                        f.write(cleaned)
                    print(f"Sanitized content in: {filepath}")
            except Exception as e:
                print(f"Skipped {filepath}: {e}")
        print("Deep content text sanitization completed successfully.")
        '

    - name: Commit and Push Cleaned Repository State
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "Absolute purge and deep content sanitization of hidden Unicode" || echo "No changes to commit"
        git push || echo "No push needed"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .
        pip install pytest pytest-cov

    - name: Final Integrity Verification Check
      run: |
        python -c '
        import os
        bad_chars = ["\u2060", "\u200b", "\ufeff"]
        infected = []
        for root, dirs, files in os.walk("."):
            if ".git" in root or "__pycache__" in root:
                continue
            for name in files + dirs:
                if any(bc in name for bc in bad_chars):
                    infected.append(os.path.join(root, name))
            for file in files:
                if file == "ci.yml": continue
                fp = os.path.join(root, file)
                try:
                    with open(fp, "r", encoding="utf-8", errors="ignore") as f:
                        if any(bc in f.read() for bc in bad_chars):
                            infected.append(fp)
                except:
                    pass
        if infected:
            print(f"❌ Found lingering contamination in: {infected}")
            exit(1)
        else:
            print("✅ ABSOLUTE PURITY VERIFIED: Repository is 100% clean of hidden Unicode and system artifacts.")
        '

    - name: Run Tests with Coverage
      run: |
        PYTHONPATH=. pytest tests/ --cov=src --cov-report=term --cov-report=xml

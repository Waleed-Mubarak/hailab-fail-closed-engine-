name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Absolute Root and File Path Purge
      run: |
        python -c '
        import os, subprocess
        bad_chars = ["\u2060", "\u200b", "\ufeff"]
        
        for root, dirs, files in os.walk(".", topdown=False):
            for name in files + dirs:
                if any(bc in name for bc in bad_chars):
                    old_p = os.path.join(root, name)
                    clean_name = name
                    for bc in bad_chars:
                        clean_name = clean_name.replace(bc, "")
                    new_p = os.path.join(root, clean_name)
                    try:
                        subprocess.run(["git", "mv", old_p, new_p], check=False)
                    except Exception:
                        try:
                            os.rename(old_p, new_p)
                        except:
                            pass
        ' || true

    - name: Commit and Push Cleaned Repository State
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "Absolute purge of hidden Unicode from all paths" || echo "No changes to commit"
        git push || echo "No push needed"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .
        pip install pytest pytest-cov

    - name: Sanity Check File Names Validation
      run: |
        python -c '
        import os, sys
        bad_chars = ["\u2060", "\u200b", "\ufeff"]
        violations = []
        for root, dirs, files in os.walk("."):
            for f in files + dirs:
                for bc in bad_chars:
                    if bc in f:
                        violations.append(os.path.join(root, f))
        if violations:
            print(f"CRITICAL: Found non-standard/hidden unicode characters in filenames: {violations}")
            sys.exit(1)
        print("File names sanity check passed: No hidden unicode characters found.")
        '

    - name: Run Tests with Coverage
      run: |
        PYTHONPATH=. pytest tests/ --cov=src --cov-report=term --cov-report=xml

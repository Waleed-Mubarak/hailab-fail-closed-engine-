name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .
        pip install pytest pytest-cov

    - name: Run Automatic Sanitizer Script (E-04 Fix)
      run: |
        if [ -f clean_test_files.py ]; then python clean_test_files.py; fi

    - name: Sanity Check File Names Validation
      run: |
        python -c '
        import os, sys
        bad_chars = ["\u2060", "\u200b", "\ufeff"]
        violations = []
        for root, dirs, files in os.walk("."):
            for f in files:
                for bc in bad_chars:
                    if bc in f:
                        violations.append(os.path.join(root, f))
        if violations:
            print(f"CRITICAL: Found non-standard/hidden unicode characters in filenames: {violations}")
            sys.exit(1)
        print("File names sanity check passed: No hidden unicode characters found.")
        '

    - name: Run Tests with Coverage
      run: |
        PYTHONPATH=. pytest tests/ --cov=src --cov-report=term --cov-report=xml

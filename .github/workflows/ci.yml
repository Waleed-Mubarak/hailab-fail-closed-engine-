name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # السماح للأكشن بتحديث ورفع الملفات النظيفة للمستودع

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Ultimate File Path Purge Script
      run: |
        python -c '
        import os, subprocess
        target = "\u2060"
        for root, dirs, files in os.walk(".", topdown=False):
            for name in files:
                if target in name or "\u200b" in name or "\ufeff" in name:
                    old_p = os.path.join(root, name)
                    clean_name = name.replace(target, "").replace("\u200b", "").replace("\ufeff", "")
                    new_p = os.path.join(root, clean_name)
                    try:
                        subprocess.run(["git", "mv", old_p, new_p], check=False)
                        print(f"Git moved: {old_p} -> {new_p}")
                    except Exception as e:
                        os.rename(old_p, new_p)
                        print(f"Renamed: {old_p} -> {new_p}")
        ' || true

    - name: Commit and Push Cleaned Repository State
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "Auto-purge hidden Unicode U+2060 from repository paths and filenames" || echo "No changes to commit"
        git push || echo "No push needed"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .
        pip install pytest pytest-cov

    - name: Sanity Check File Names Validation
      run: |
        python -c '
        import os, sys
        bad_chars = ["\u2060", "\u200b", "\ufeff"]
        violations = []
        for root, dirs, files in os.walk("."):
            for f in files:
                for bc in bad_chars:
                    if bc in f:
                        violations.append(os.path.join(root, f))
        if violations:
            print(f"CRITICAL: Found non-standard/hidden unicode characters in filenames: {violations}")
            sys.exit(1)
        print("File names sanity check passed: No hidden unicode characters found.")
        '

    - name: Run Tests with Coverage
      run: |
        PYTHONPATH=. pytest tests/ --cov=src --cov-report=term --cov-report=xml

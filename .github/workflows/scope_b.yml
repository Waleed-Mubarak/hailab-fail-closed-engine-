name: Scope B CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-scope-b-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: python:3.10-slim
      options: --privileged --cap-add=ALL
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system and python dependencies
        run: |
          apt-get update && apt-get install -y gcc libc6-dev
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout

      - name: Run Scope B Tests
        run: |
          pytest -v -s --timeout=15 tests/scope_b/test_engine.py
